# Prometheus configuration for the spectado-stream-recorder example stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: recorder
    metrics_path: /metrics
    # If METRICS_REQUIRE_AUTH=true, add:
    # authorization:
    #   type: Bearer
    #   credentials: <API_TOKEN>
    static_configs:
      - targets: ["recorder:8080"]
